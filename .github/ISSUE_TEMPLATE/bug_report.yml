name: Bug report
description: Report reproducible behavior that is not working as documented.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Workframe. Do not include credentials, private
        infrastructure details, or vulnerability information in a public issue.
  - type: input
    id: version
    attributes:
      label: Workframe version
      description: Run `workframe version`.
      placeholder: workframe 1.5.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant output after removing usernames, paths, hosts, addresses, and credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private infrastructure details from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
