<svg xmlns="http://www.w3.org/2000/svg" width="1426" height="540" viewBox="0 0 1426 540" role="img" aria-labelledby="title desc">
  <title id="title">Workframe workspace lifecycle</title>
  <desc id="desc">Clone a canonical repository, create an agent worktree, work on an isolated branch, then archive and resume it or open a pull request and safely remove it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11Z" fill="#202020"/>
    </marker>
    <style>
      .label { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
      .copy { font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #202020; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1426" height="540" rx="58" fill="#F0FB29"/>
  <text x="76" y="70" class="label" fill="#202020">WORKSPACE LIFECYCLE</text>

  <path class="flow" d="M330 174H401"/>
  <path class="flow" d="M661 174H732"/>
  <path class="flow" d="M992 174H1061"/>
  <path class="flow" d="M1168 282V310H865V330"/>
  <path class="flow" d="M1216 263V330"/>
  <path class="flow" d="M730 397H534V241"/>

  <rect x="76" y="115" width="254" height="118" rx="24" fill="#202020"/>
  <text x="203" y="165" text-anchor="middle" class="label" fill="#F0FB29">CLONE</text>
  <text x="203" y="203" text-anchor="middle" class="small" fill="#F0FB29">canonical repo</text>

  <rect x="407" y="115" width="254" height="118" rx="24" fill="#202020"/>
  <text x="534" y="165" text-anchor="middle" class="label" fill="#F0FB29">CREATE</text>
  <text x="534" y="203" text-anchor="middle" class="small" fill="#F0FB29">agent worktree</text>

  <rect x="738" y="115" width="254" height="118" rx="24" fill="#202020"/>
  <text x="865" y="165" text-anchor="middle" class="label" fill="#F0FB29">WORK</text>
  <text x="865" y="203" text-anchor="middle" class="small" fill="#F0FB29">isolated branch</text>

  <path d="M1168 67L1282 174L1168 282L1054 174Z" fill="#F0FB29" stroke="#202020" stroke-width="8"/>
  <text x="1168" y="166" text-anchor="middle" class="label" fill="#202020">WHAT</text>
  <text x="1168" y="200" text-anchor="middle" class="label" fill="#202020">NEXT?</text>

  <rect x="738" y="338" width="254" height="118" rx="24" fill="#202020"/>
  <text x="865" y="388" text-anchor="middle" class="label" fill="#F0FB29">ARCHIVE</text>
  <text x="865" y="426" text-anchor="middle" class="small" fill="#F0FB29">keep the branch</text>

  <rect x="1101" y="338" width="254" height="118" rx="24" fill="#202020"/>
  <text x="1228" y="388" text-anchor="middle" class="label" fill="#F0FB29">FINISH</text>
  <text x="1228" y="426" text-anchor="middle" class="small" fill="#F0FB29">PR + safe remove</text>

  <rect x="947" y="289" width="112" height="42" rx="21" fill="#202020"/>
  <text x="1003" y="318" text-anchor="middle" class="label" font-size="18" fill="#F0FB29">PAUSE</text>

  <rect x="1240" y="278" width="112" height="42" rx="21" fill="#202020"/>
  <text x="1296" y="307" text-anchor="middle" class="label" font-size="18" fill="#F0FB29">DONE</text>

  <rect x="562" y="376" width="132" height="42" rx="21" fill="#202020"/>
  <text x="628" y="405" text-anchor="middle" class="label" font-size="18" fill="#F0FB29">RESUME</text>
</svg>
